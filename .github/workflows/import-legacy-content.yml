name: Import legacy website content

on:
  push:
    branches: [main]
    paths:
      - 'griya_medistra gem.html'
      - 'scripts/import_legacy_content.py'
      - '.github/workflows/import-legacy-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Import old site content
        run: python scripts/import_legacy_content.py
      - name: Save imported content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-content.json
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Import legacy website content into new design"
            git pull --rebase origin main
            git push
          fi
